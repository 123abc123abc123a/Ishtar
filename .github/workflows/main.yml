name: Build iOS Tweak (Theos)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos Dependencies
        run: brew install ldid

      - name: Setup Theos and iOS SDK
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          rm -rf $HOME/theos/sdks
          git clone https://github.com/theos/sdks.git $HOME/theos/sdks
          
          # Fix missing SDK error: Find any iOS 15/16/17 SDK and alias it to 16.0
          cd $HOME/theos/sdks
          AVAILABLE_SDK=$(ls -d iPhoneOS*.sdk | head -n 1)
          if [ ! -z "$AVAILABLE_SDK" ]; then
            ln -s "$AVAILABLE_SDK" iPhoneOS16.0.sdk
            echo "Aliased $AVAILABLE_SDK to iPhoneOS16.0.sdk"
          fi

      - name: Compile Tweak
        run: |
          make FINALPACKAGE=1 TARGET="iphone:clang:latest:14.0"

      - name: Extract and Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-Dylib
          path: .theos/obj/**/*.dylib
          include-hidden-files: true
